    <div class="top-header">
        <div class="logo">
            <img src="images/logo.png" alt="Warm Haven Logo">

    <div class="container">
            <div id="register_form">
                <form action="process_register.php" method="post">
                <div class="group">
                    <label for="username">First Name:</label> <input type="text" id="username" name="firstname" placeholder="Enter your first name" required>
                </div>
                <div class="group">
                    <label for="lastname">Last Name:</label> <input type="text" id="lastname" name="lastname" placeholder="Enter your last name" required>
                </div>
                <div class="group">
                    <label for="email">Email:</label> <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="group">
                    <label for="reason">Why do you want to volunteer?</label>
                    <textarea id="reason" name="reason" required></textarea> 
                </div>
                <div class="group-terms">
                    <input type="checkbox" value="1" id="terms" required><label for="terms"> I agree to the terms and conditions</label>
                </div>
                <div>
                    <label><input type="submit" value="Register" id="button"></label>
                </div>
                </form>
            </div>
        </div>
